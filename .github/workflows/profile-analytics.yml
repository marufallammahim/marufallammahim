name: Update GitHub Profile Analytics

on:
  push:
    paths:
      - ".github/workflows/profile-analytics.yml"
      - ".github/scripts/generate_all_branch_analytics.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: true

jobs:
  update-analytics:
    name: Generate All-Repository, All-Branch Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate analytics from every public repository and branch
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: marufallammahim
        run: python .github/scripts/generate_all_branch_analytics.py

      - name: Commit updated analytics cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update all-branch GitHub analytics"
          git push
